<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Módulo Administrativo - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark py-3">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">🛡️ Banco Horizonte — Administración</a>
      <a href="/" class="btn btn-outline-light btn-sm">← Volver al Portal</a>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card auth-card p-4">
          <div class="card-body">
            <span class="badge bg-dark mb-2">Uso Interno</span>
            <h2 class="h4 fw-bold mb-1">Panel Administrativo del Banco</h2>
            <p class="text-muted small mb-4">Acceso exclusivo para personal administrativo autorizado.</p>

            <div id="alertaMensaje" class="alert d-none" role="alert"></div>

            <!-- Panel de sesión activa -->
            <div id="panelSesionActiva" class="d-none">
              <div class="alert alert-success">
                <h6 class="fw-bold mb-1">✅ Sesión Administrativa Activa</h6>
                <p class="mb-1 small" id="infoAdminSesion"></p>
              </div>
              <div class="d-grid gap-2">
                <a href="/admin/dashboard.html" class="btn btn-dark">
                  Ir al Dashboard Administrativo
                </a>
                <button type="button" id="btnCerrarSesion" class="btn btn-outline-danger">
                  Cerrar Sesión
                </button>
              </div>
            </div>

            <!-- Formulario de Login Admin -->
            <form id="formLoginAdmin" novalidate>
              <div class="mb-3">
                <label for="identificador" class="form-label fw-semibold">Correo o Documento</label>
                <input
                  type="text"
                  id="identificador"
                  class="form-control"
                  placeholder="Ej: admin@banco.com"
                  required
                />
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Contraseña</label>
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  placeholder="Ingresa tu contraseña de administrador"
                  required
                />
              </div>

              <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
                Ingresar al Panel
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('formLoginAdmin');
    const alerta = document.getElementById('alertaMensaje');
    const panelSesion = document.getElementById('panelSesionActiva');
    const infoAdminSesion = document.getElementById('infoAdminSesion');
    const btnCerrarSesion = document.getElementById('btnCerrarSesion');

    function mostrarAlerta(tipo, texto) {
      alerta.className = `alert alert-${tipo}`;
      alerta.textContent = texto;
      alerta.classList.remove('d-none');
    }

    async function verificarSesion() {
      try {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        if (data.ok && data.usuario && data.usuario.rol === 'ADMIN') {
          form.classList.add('d-none');
          panelSesion.classList.remove('d-none');
          infoAdminSesion.textContent = `${data.usuario.nombre_completo} (${data.usuario.correo}) — Rol: ${data.usuario.rol}`;
        }
      } catch (err) {
        console.error(err);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alerta.classList.add('d-none');

      const identificador = document.getElementById('identificador').value.trim();
      const password = document.getElementById('password').value;

      if (!identificador || !password) {
        mostrarAlerta('warning', 'Por favor completa todos los campos.');
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identificador,
            password,
            rolEsperado: 'ADMIN'
          })
        });
        const data = await res.json();

        if (!res.ok || !data.ok) {
          mostrarAlerta('danger', data.mensaje || 'Error al iniciar sesión.');
          return;
        }

        const checkDash = await fetch('/admin/dashboard.html', { method: 'HEAD' });
        if (checkDash.ok) {
          window.location.href = '/admin/dashboard.html';
        } else {
          await verificarSesion();
        }
      } catch (error) {
        mostrarAlerta('danger', 'Error de conexión con el servidor.');
      }
    });

    btnCerrarSesion.addEventListener('click', async () => {
      await fetch('/api/auth/logout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ modulo: 'usuario' })
      });
      panelSesion.classList.add('d-none');
      form.classList.remove('d-none');
      form.reset();
      mostrarAlerta('info', 'Sesión administrativa cerrada correctamente.');
    });

    verificarSesion();
  </script>
</body>
</html>
