<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banca Virtual Cliente - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-dark navbar-banco py-3">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">🏦 Banco Horizonte</a>
      <a href="/" class="btn btn-outline-light btn-sm">← Volver al Portal</a>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card auth-card p-4">
          <div class="card-body">
            <span class="badge bg-primary mb-2">Módulo de Cliente</span>
            <h2 class="h4 fw-bold mb-1">Banca Virtual Personas</h2>
            <p class="text-muted small mb-4">Ingresa con tu correo electrónico o documento de identidad.</p>

            <div id="alertaMensaje" class="alert d-none" role="alert"></div>

            <!-- Panel de sesión activa (se muestra cuando el cliente inicia sesión) -->
            <div id="panelSesionActiva" class="d-none">
              <div class="alert alert-success">
                <h6 class="fw-bold mb-1">✅ Sesión de Cliente Activa</h6>
                <p class="mb-1 small" id="infoClienteSesion"></p>
              </div>
              <div class="d-grid gap-2">
                <a href="/cliente/dashboard.html" id="btnIrDashboard" class="btn btn-banco">
                  Ir a mi Panel de Banca Virtual
                </a>
                <button type="button" id="btnCerrarSesion" class="btn btn-outline-danger">
                  Cerrar Sesión
                </button>
              </div>
            </div>

            <!-- Formulario de Login -->
            <form id="formLoginCliente" novalidate>
              <div class="mb-3">
                <label for="identificador" class="form-label fw-semibold">Correo o Documento</label>
                <input
                  type="text"
                  id="identificador"
                  class="form-control"
                  placeholder="Ej: juan@correo.com o 1000000002"
                  required
                />
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Contraseña</label>
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  placeholder="Ingresa tu contraseña"
                  required
                />
              </div>

              <button type="submit" id="btnSubmit" class="btn btn-banco w-100 py-2">
                Iniciar Sesión
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('formLoginCliente');
    const alerta = document.getElementById('alertaMensaje');
    const panelSesion = document.getElementById('panelSesionActiva');
    const infoClienteSesion = document.getElementById('infoClienteSesion');
    const btnCerrarSesion = document.getElementById('btnCerrarSesion');

    function mostrarAlerta(tipo, texto) {
      alerta.className = `alert alert-${tipo}`;
      alerta.textContent = texto;
      alerta.classList.remove('d-none');
    }

    async function verificarSesion() {
      try {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        if (data.ok && data.usuario && data.usuario.rol === 'CLIENTE') {
          form.classList.add('d-none');
          panelSesion.classList.remove('d-none');
          infoClienteSesion.textContent = `${data.usuario.nombre_completo} (${data.usuario.correo}) — Cuenta #${data.usuario.numero_cuenta} (${data.usuario.tipo_cuenta})`;
        }
      } catch (err) {
        console.error(err);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alerta.classList.add('d-none');

      const identificador = document.getElementById('identificador').value.trim();
      const password = document.getElementById('password').value;

      if (!identificador || !password) {
        mostrarAlerta('warning', 'Por favor completa todos los campos.');
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identificador,
            password,
            rolEsperado: 'CLIENTE'
          })
        });
        const data = await res.json();

        if (!res.ok || !data.ok) {
          mostrarAlerta('danger', data.mensaje || 'Error al iniciar sesión.');
          return;
        }

        // Si ya existe el dashboard de la Fase 4 redirigimos; de lo contrario mostramos el estado de sesión activa
        const checkDash = await fetch('/cliente/dashboard.html', { method: 'HEAD' });
        if (checkDash.ok) {
          window.location.href = '/cliente/dashboard.html';
        } else {
          await verificarSesion();
        }
      } catch (error) {
        mostrarAlerta('danger', 'Error de conexión con el servidor.');
      }
    });

    btnCerrarSesion.addEventListener('click', async () => {
      await fetch('/api/auth/logout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ modulo: 'usuario' })
      });
      panelSesion.classList.add('d-none');
      form.classList.remove('d-none');
      form.reset();
      mostrarAlerta('info', 'Has cerrado sesión correctamente.');
    });

    verificarSesion();
  </script>
</body>
</html>
